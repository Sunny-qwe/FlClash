name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The release budget in bytes for the desktop binary, `concord`. The design target is 15 MB.
  CORE_MAX_BYTES: 30000000
  # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
  CA_BUNDLE: cacert-2026-09-25.pem
  CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
  # FlClash's `cargoCore` builds `libconcord.so` with this NDK and API level.
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_API: 24
  # The interop peer: the mihomo release `.agents/reference-choices.md` names, pinned by hash per architecture.
  MIHOMO_VERSION: v1.19.33
  MIHOMO_SHA256_X64: 8ec92e7b2fdc6b853ba00156bab7e4e965c8b0d843b8c4ac8ab98795f02ad524
  MIHOMO_SHA256_ARM64: ba408b317080ee265c46cb923a50018c1b82cbd708551cdd46a1e3e307396187

jobs:
  check:
    name: Check
    # A private repository pays for its Actions minutes, so it runs the checks only when started by hand.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2

      - name: Fetch CA certificates
        run: |
          bundle=assets/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      # The workspace build turns these features on, so only a crate built alone goes without them.
      - name: Check crates without their optional features
        run: |
          for crate in concord-common concord-engine concord-mitm; do
            cargo clippy -p "$crate" --no-default-features --all-targets --locked -- -D warnings
            cargo test -p "$crate" --no-default-features --locked
          done

      - name: Check crate layers
        run: cargo run --locked -p xtask -- check-layers

      - name: Check generated schema
        run: cargo run --locked -p xtask -- schema --check

      - name: Check dependencies
        run: cargo deny check

      - name: Check fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      - name: Build release core
        run: cargo build --release --locked -p concord-desktop

      - name: Check binary size
        run: cargo run --locked -p xtask -- check-size target/release/concord "$CORE_MAX_BYTES"

      - name: Check that no tracked file changed
        run: git diff --exit-code -- . ':!assets/ca-certificates.crt'

  interop:
    name: mihomo interop
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch mihomo
        run: |
          case "$(uname -m)" in
            x86_64) asset=mihomo-linux-amd64-v1-$MIHOMO_VERSION.gz sum=$MIHOMO_SHA256_X64 ;;
            aarch64) asset=mihomo-linux-arm64-$MIHOMO_VERSION.gz sum=$MIHOMO_SHA256_ARM64 ;;
            *) echo "no pinned mihomo for $(uname -m)" >&2; exit 1 ;;
          esac
          peer=$RUNNER_TEMP/mihomo
          curl -fsSL --retry 3 -o "$peer.gz" \
            "https://github.com/MetaCubeX/mihomo/releases/download/$MIHOMO_VERSION/$asset"
          echo "$sum  $peer.gz" | sha256sum -c -
          gunzip "$peer.gz"
          chmod +x "$peer"
          "$peer" -v
          echo "CONCORD_MIHOMO=$peer" >> "$GITHUB_ENV"

      # The Hysteria v1 case needs its own server, which mihomo does not provide.
      - name: Run the interop tests
        run: >-
          cargo test --locked -p concord-proxy --test interop --
          --ignored --skip hysteria_talks_to_the_reference_server

  macos:
    name: macOS
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  android:
    name: Android clippy
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # The variables FlClash's `cargoCore` sets for `aarch64-linux-android`.
      - name: Point cargo at the NDK
        run: |
          ndk=$ANDROID_NDK_ROOT
          host=$(ls -d "$ndk"/toolchains/llvm/prebuilt/*/)
          clang=${host}bin/aarch64-linux-android$ANDROID_API-clang
          toolchain=$RUNNER_TEMP/android.toolchain.cmake
          printf 'set(ANDROID_ABI "arm64-v8a")\nset(ANDROID_PLATFORM "android-%s")\ninclude("%s")\n' \
            "$ANDROID_API" "$ndk/build/cmake/android.toolchain.cmake" > "$toolchain"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$clang"
            echo "CXX_aarch64_linux_android=$clang++"
            echo "AR_aarch64_linux_android=${host}bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang"
            echo "CMAKE_TOOLCHAIN_FILE_aarch64_linux_android=$toolchain"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=${host}sysroot --target=aarch64-linux-android$ANDROID_API"
            echo "BORING_BSSL_RUST_CPPLIB=c++_static"
          } >> "$GITHUB_ENV"

      - name: Clippy
        run: >-
          cargo clippy --workspace --all-targets --locked --target aarch64-linux-android --
          -D warnings -A clippy::missing_const_for_thread_local

  windows:
    name: Windows clippy
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: windows-latest
    timeout-minutes: 120
    # Not yet seen to pass on a hosted runner; a failure here does not fail the run until it has.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # BoringSSL's x86_64 assembly needs NASM; CMake, MSVC and LLVM come with the image.
      - name: Install NASM
        shell: bash
        run: |
          choco install nasm --no-progress -y > /dev/null
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
