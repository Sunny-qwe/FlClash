[env]
# Avoid AWS-LC's cold jitter collection; the entropy-source trade-off is in .agents/embedding.md.
AWS_LC_SYS_NO_JITTER_ENTROPY = "1"
CMAKE_GENERATOR_aarch64_pc_windows_msvc = "Ninja"
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = "cmake/boring-arm64-windows.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = "cmake/boring-x64-windows.cmake", relative = true }

[alias]
xtask = "run -p xtask --"
