mixed-port: 7890
port: 7891
socks-port: 7892
allow-lan: true
bind-address: "*"
mode: global
log-level: debug
ipv6: true
tcp-concurrent: true
unified-delay: true
find-process-mode: always
interface-name: en0
routing-mark: 6666
keep-alive-interval: 15
global-client-fingerprint: chrome
geodata-mode: false
geo-auto-update: true
geo-update-interval: 12
geox-url:
  geosite: https://example.test/geosite.dat
  mmdb: https://example.test/country.mmdb
  asn: https://example.test/asn.mmdb
authentication:
  - "user:pass"
skip-auth-prefixes:
  - 127.0.0.1/8
lan-allowed-ips:
  - 192.168.0.0/16
lan-disallowed-ips:
  - 192.168.9.0/24
profile:
  store-selected: false
  store-fake-ip: false
