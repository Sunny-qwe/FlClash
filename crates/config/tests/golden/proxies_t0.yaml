proxies:
  - {name: "ss one", type: ss, server: 192.0.2.1, port: 8388, cipher: aes-256-gcm, password: secret, udp: true}
  - {name: ss-plugin, type: ss, server: 192.0.2.2, port: 8389, cipher: chacha20-ietf-poly1305, password: secret, plugin: obfs, plugin-opts: {mode: tls, host: example.test}}
  - {name: vmess ws, type: vmess, server: 192.0.2.3, port: 443, uuid: 6a4f3bc1-2c44-4a43-a5a3-3f1a2b0e6a11, alterId: 0, cipher: auto, tls: true, servername: example.test, network: ws, ws-opts: {path: /ws, headers: {Host: example.test}}}
  - {name: vless reality, type: vless, server: 192.0.2.4, port: 443, uuid: 6a4f3bc1-2c44-4a43-a5a3-3f1a2b0e6a11, tls: true, flow: xtls-rprx-vision, servername: example.test, client-fingerprint: chrome, reality-opts: {public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA, short-id: "0123abcd"}}
  - {name: trojan grpc, type: trojan, server: 192.0.2.5, port: 443, password: secret, sni: example.test, network: grpc, grpc-opts: {grpc-service-name: svc}}
  - {name: hy2, type: hysteria2, server: 192.0.2.6, port: 443, password: secret, sni: example.test, up: 30 Mbps, down: 200 Mbps, obfs: salamander, obfs-password: pw}
  - {name: tuic, type: tuic, server: 192.0.2.7, port: 443, uuid: 6a4f3bc1-2c44-4a43-a5a3-3f1a2b0e6a11, password: secret, congestion-controller: bbr, udp-relay-mode: native, alpn: [h3]}
  - {name: anytls, type: anytls, server: 192.0.2.8, port: 443, password: secret, sni: example.test, idle-session-check-interval: 30}
  - {name: socks, type: socks5, server: 192.0.2.9, port: 1080, username: u, password: p, udp: true}
  - {name: http, type: http, server: 192.0.2.10, port: 8080, tls: true, skip-cert-verify: true}
