sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: false
    QUIC:
      ports: [443]
  force-domain:
    - "+.force.test"
  skip-domain:
    - "Mijia Cloud"
    - "+.skip.test"
  skip-src-address:
    - 192.168.0.3/32
  skip-dst-address:
    - 192.168.0.4/32
