[package]
name = "concord-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Length-prefixed frames and the session-token handshake for Concord's local socket"
repository.workspace = true

[lib]
doctest = false

[dependencies]
concord-rpc = { workspace = true }
concord-proto = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time", "macros", "rt", "signal"] }
hmac = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
concord-test-support = { workspace = true }
concord-proto = { workspace = true }
concord-api = { workspace = true }
concord-engine = { workspace = true }
concord-platform = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
